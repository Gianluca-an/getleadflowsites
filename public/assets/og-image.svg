<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="630" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C29A47"/><stop offset="1" stop-color="#E6C77E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.08" r="0.6">
      <stop stop-color="#C29A47" stop-opacity="0.18"/><stop offset="1" stop-color="#C29A47" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#FBFAF6"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo -->
  <g transform="translate(96,84)">
    <rect width="60" height="60" rx="14" fill="#141210"/>
    <path d="M14 41 L26 29 L35 36 L47 20" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 20 L47 30 M47 20 L37 20" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="41" r="3.6" fill="#E6C77E"/>
  </g>
  <text x="176" y="126" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="700" fill="#181510">GetLeadFlow</text>

  <!-- headline -->
  <text x="96" y="300" font-family="Georgia,'Times New Roman',serif" font-size="76" font-weight="700" fill="#181510">Booked ceramic coating</text>
  <text x="96" y="388" font-family="Georgia,'Times New Roman',serif" font-size="76" font-weight="700"><tspan fill="#181510">jobs — </tspan><tspan fill="#96691F" font-style="italic">guaranteed.</tspan></text>

  <text x="96" y="456" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#4B473F">We run the ads, work every lead, and book the jobs on your calendar.</text>

  <!-- gold pill -->
  <rect x="96" y="506" width="520" height="62" rx="31" fill="url(#gold)"/>
  <text x="356" y="545" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#1a1610" text-anchor="middle">7–12 booked jobs · One detailer per city</text>

  <text x="1104" y="588" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#8B867A" text-anchor="end">getleadflowsites.com</text>
</svg>
