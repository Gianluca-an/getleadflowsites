  <style>
    :root{
      --ob:#0C0C0E; --ob-2:#15130F; --cream:#F1EBDE; --mut:#B3AA97;
      --gold:#C29A47; --gold-2:#E6C77E; --gold-deep:#9A6E24;
      --serif:"Playfair Display",Georgia,serif; --sans:"Inter","Segoe UI",system-ui,sans-serif;
      --ease:cubic-bezier(.16,1,.3,1);
    }
    *{box-sizing:border-box} html,body{margin:0;height:100%}
    body{
      font-family:var(--sans); color:var(--cream); background:var(--ob);
      min-height:100%; display:grid; place-items:center; text-align:center; padding:40px 22px;
      -webkit-font-smoothing:antialiased; position:relative; overflow:hidden;
    }
    body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(760px 460px at 50% -8%, rgba(194,154,71,.20), transparent 62%),
        radial-gradient(620px 520px at 88% 112%, rgba(194,154,71,.10), transparent 60%);}
    .wrap{position:relative; z-index:1; max-width:640px; animation:rise .9s var(--ease) both}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

    .mark{width:60px;height:60px;margin:0 auto 26px;display:block}
    .brand{font-family:var(--serif);font-weight:700;font-size:1.5rem;letter-spacing:.01em;color:var(--cream);margin:0 0 30px}

    .rule{width:120px;height:1px;margin:0 auto 26px;position:relative;overflow:hidden;background:rgba(233,214,170,.18)}
    .rule::after{content:"";position:absolute;inset:0;width:50%;
      background:linear-gradient(90deg,transparent,var(--gold-2),transparent);
      animation:sweep 3.2s var(--ease) infinite}
    @keyframes sweep{0%{transform:translateX(-120%)}60%,100%{transform:translateX(260%)}}

    .eyebrow{font-family:var(--sans);font-size:.76rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-2);margin:0 0 20px}
    h1{font-family:var(--serif);font-weight:600;line-height:1.1;letter-spacing:-.01em;color:#fff;
      font-size:clamp(2.3rem,6.4vw,3.6rem);margin:0 0 20px;text-wrap:balance}
    h1 em{font-style:italic;color:var(--gold-2)}
    .lead{color:var(--mut);font-size:clamp(1rem,1.7vw,1.15rem);line-height:1.6;max-width:46ch;margin:0 auto 34px}

    .cta{display:inline-flex;align-items:center;gap:10px;font-family:var(--sans);font-weight:600;font-size:1rem;
      color:#1a1610;background:linear-gradient(120deg,var(--gold),var(--gold-2));padding:15px 30px;border-radius:999px;
      text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s;box-shadow:0 18px 40px -18px rgba(194,154,71,.6)}
    .cta:hover{transform:translateY(-2px);box-shadow:0 22px 48px -18px rgba(194,154,71,.8)}
    .cta svg{width:17px;height:17px}
    .email{display:block;margin-top:20px;color:var(--mut);font-size:.95rem;text-decoration:none}
    .email b{color:var(--cream);font-weight:500}
    .email:hover b{color:var(--gold-2)}

    footer{position:fixed;bottom:22px;left:0;right:0;z-index:1;color:rgba(179,170,151,.6);font-size:.8rem;letter-spacing:.02em}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <rect x="1.5" y="1.5" width="37" height="37" rx="11" fill="#17140D" stroke="rgba(233,214,170,.22)"/>
      <path d="M9 27 L17 19 L23 24 L31 13" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M31 13 L31 19 M31 13 L25 13" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9" cy="27" r="2.4" fill="#E6C77E"/>
      <defs><linearGradient id="g" x1="6" y1="34" x2="34" y2="6" gradientUnits="userSpaceOnUse"><stop stop-color="#C29A47"/><stop offset="1" stop-color="#E6C77E"/></linearGradient></defs>
    </svg>
    <p class="brand">GetLeadFlow</p>

    <div class="rule"></div>
    <p class="eyebrow">Coming soon</p>
    <h1>Something new is <em>on its way.</em></h1>
    <p class="lead">We're redesigning our site. In the meantime, we're still booking ceramic coating &amp; PPF jobs for detailers — reach out and let's talk.</p>

    <a class="cta" href="mailto:contact@getleadflowsites.com?subject=GetLeadFlow%20enquiry">Get in touch
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a class="email" href="mailto:contact@getleadflowsites.com"><b>contact@getleadflowsites.com</b></a>
  </div>
  <footer>© <span id="y"></span> GetLeadFlow Sites · One detailer per city</footer>
  <script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
